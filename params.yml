
# OCP Parameters
ocp_url: https://api.sre-cld-ldap-fsx-540-tar-g2.cpdonawsonline.com:6443
ocp_username: ocadmin  # a cluster admin user
ocp_password: password
ocp_token: <required if user/password not available>
ocp_apikey: <required if neither user/password or token not available>

storageClass_ReadWriteOnce: ontap-nas # eg "ocs-storagecluster-ceph-rbd"
storageClass_ReadWriteMany: ontap-nas  # eg "ocs-storagecluster-cephfs"

run_storage_perf: true

arch: amd64  # amd64, ppc64le

############################ STORAGE PERFORMANCE PARAMETERS START #######################
# vars file for roles/storage-perf-test
storage_perf_namespace: k8sspf  # openshift namespace/project where jobs will be executed, it will be created by playbook if not already existing.
logfolder: '.logs'
#imageurl: icr.io/cpopen/cpd/k8s-storage-perf:5.2.2
#imageurl: cp.stg.icr.io/cp/cpd/k8s-storage-perf:5.4.0.20260602.122953.169.amd64
#imageurl: cp.stg.icr.io/cp/cpd/k8s-storage-perf:5.4.0.1.20260602.131423.170.amd64
#imageurl: cp.stg.icr.io/cp/cpd/k8s-storage-perf:5.4.0.1.20260602.171047.175.amd64
imageurl: cp.stg.icr.io/cp/cpd/k8s-storage-perf:5.4.0.20260602.180010.176.amd64

cluster_infrastructure: aws # optional labels eg ibmcloud, aws, azure, vmware
cluster_name: fsx-540 # optional labels 
storage_type: fsx # optional label eg portworx, ocs, <storage vendor>

# To run the performace jobs on a dedicated compute nodes, set the node label which meet the criteria.
# The idea is to gather performance data when the jobs are running remotely from a storage node.
# A cluster administrator can label a node by running this query with appropriate label key/value: 
# oc label node <node name> "<label_key>=<label_value>" --overwrite
dedicated_compute_node:
   label_key: "<optional>"
   label_value: "<optional>"
   
# The size of persistent volume claims (PVCs) for ReadWriteMany (RWX) storage classes.
# If your storage provider offers different storage tiers or if the volume size limits the IOPS capacity,
# follow the guidance from your storage provider to ensure you have sufficient IOPS. 
rwx_storagesize: 10Gi

# The size of persistent volume claims (PVCs) for ReadWriteOnce (RWO) storage classes.
# If your storage provider offers different storage tiers or if the volume size limits the IOPS capacity,
# follow the guidance from your storage provider to ensure you have sufficient IOPS. 
rwo_storagesize: 10Gi

# I/O mode and fsync settings for sysbench tests
# ioMode: async with dsync flag forces O_DSYNC behavior
# fsyncFreq: do fsync() after this number of requests (0 = don't use fsync, default=100)
# file_extra_flags: dsync adds O_DSYNC flag for direct synchronous writes to disk
# For true dsync behavior: ioMode=async, fsyncFreq=0, file_extra_flags=dsync
ioMode: async
fsyncFreq: 0
file_extra_flags: dsync

#sysbench random read
sysbench_random_read: false
rread_threads: 8            # 1,4,8,16
rread_fileTotalSize: 128m
rread_fileNum: 128
rread_fileBlockSize: 4k     # 4k,8k,16k

#sysbench random write
sysbench_random_write: true
rwrite_threads: 8           # 1,4,8,16
rwrite_fileTotalSize: 4096m
rwrite_fileNum: 4
rwrite_fileBlockSize: 4k    # 4k,8k,16k

#sysbench sequential read
sysbench_sequential_read: false
sread_threads: 2            # 1,2
sread_fileTotalSize: 4096m
sread_fileNum: 4
sread_fileBlockSize: 1g     # 512m,1g

#sysbench sequential write
sysbench_sequential_write: true
swrite_threads: 2           # 1,2
swrite_fileTotalSize: 4096m
swrite_fileNum: 4
swrite_fileBlockSize: 1g    # 512m,1g

############################ STORAGE PERFORMANCE PARAMETERS END #########################

