---
# Run sysbench test
- name: Run sysbench sequential write rwo test
  block:
    - name: Delete existing sysbench sequential write rwo job if present
      kubernetes.core.k8s:
        state: absent
        api_version: batch/v1
        kind: Job
        namespace: "{{ storage_perf_namespace }}"
        name: sysbench-sequential-write-rwo

    - name:  Run sysbench sequential write rwo test
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'sysbench_sequential_write_rwo.yaml.j2') }}"
        wait: yes
        wait_timeout: 7200
        wait_condition:
          type: Complete
          status: "True"

    - name: Get pod info for image digest (sequential write RWO)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ storage_perf_namespace }}"
        label_selectors:
        - job-name=sysbench-sequential-write-rwo
      register: pod_info_sw_rwo

    - name: Write image digest to shared file
      local_action:
        module: copy
        content: "{{ pod_info_sw_rwo.resources[0].status.containerStatuses[0].imageID | regex_replace('^.*@', '') }}"
        dest: "{{ logfolder }}/image_digest.txt"
        force: false

    - name: Get logs of the sysbench sequential write pod for RWO
      kubernetes.core.k8s_log:
        namespace: "{{ storage_perf_namespace }}"
        label_selectors:
        - job-name=sysbench-sequential-write-rwo
      register: logo

    - name: Save sequential write Log to local file
      local_action:
        module: copy
        content: "{{ logo }}"
        dest: "{{ logfolder }}/sequential_write_rwo.json"

  rescue:
    - debug:
        msg: 
         - "Run sysbench random write RWO test failed or timed out after 2 hours." 
         - "Please check your openshift storage configuration. This is likely due to poor I/O."