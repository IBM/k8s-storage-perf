---
# Run sysbench test
- name:  Run sysbench random write RWX test
  block:
    - name: Delete existing sysbench random write rwx job if present
      kubernetes.core.k8s:
        state: absent
        api_version: batch/v1
        kind: Job
        namespace: "{{ storage_perf_namespace }}"
        name: sysbench-random-write-rwx

    - name:  Run sysbench random write RWX test
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'sysbench_random_write_rwx.yaml.j2') }}"
        wait: yes
        wait_timeout: 7200
        wait_condition:
          type: Complete
          status: "True"

    - name: Get pod info for image digest (random write RWX)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ storage_perf_namespace }}"
        label_selectors:
        - job-name=sysbench-random-write-rwx
      register: pod_info_rw_rwx

    - name: Write image digest to shared file
      local_action:
        module: copy
        content: "{{ pod_info_rw_rwx.resources[0].status.containerStatuses[0].imageID | regex_replace('^.*@', '') }}"
        dest: "{{ logfolder }}/image_digest.txt"
        force: false

    - name: Get logs of the sysbench random write pod for RWX
      kubernetes.core.k8s_log:
        namespace: "{{ storage_perf_namespace }}"
        label_selectors:
        - job-name=sysbench-random-write-rwx
      register: logx

    - name: Save random write Log to local file
      local_action:
        module: copy
        content: "{{ logx }}"
        dest: "{{ logfolder }}/random_write_rwx.json"

  rescue:
    - debug:
        msg: 
         - "Run sysbench random write RWO test failed or timed out after 2 hours." 
         - "Please check your openshift storage configuration. This is likely due to poor I/O."