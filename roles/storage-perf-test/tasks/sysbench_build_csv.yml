---
# Build CSV file
- name: Create CSV file
  ansible.builtin.script: jsontocsv.py "{{ logfolder }}"
  args:
    executable: /usr/bin/env python3
    chdir: /tmp

- name: Output node lists to CSV
  shell: oc get nodes --show-labels | awk '{print $1","$2","$3","$4","$5","$6}' > /tmp/nodes.csv

- name: Output pod lists to CSV
  shell: oc get pods -n {{ storage_perf_namespace }} -o wide | awk '{print $1","$2","$3","$4","$5","$6","$7}' > /tmp/pods.csv

- name: Output job lists to CSV
  shell: oc get jobs -n {{ storage_perf_namespace }}  | awk '{print $1","$2","$3","$4}' > /tmp/jobs.csv

- name: Print to file
  action: template src=../templates/dump.yml.j2 dest=/tmp/params.log

- name: Package storage-perf.tar
  shell: tar -cf /opt/ansible/storage-perf.tar -C /tmp result.csv nodes.csv pods.csv jobs.csv params.log -C "{{ logfolder }}" .
